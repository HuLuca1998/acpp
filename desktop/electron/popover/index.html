<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:">
<title>我的 issue</title>
<link rel="stylesheet" href="popover.css">
</head>
<body>
<div class="panel">
  <header class="head">
    <span class="head-title">我的 issue</span>
    <span class="head-count" id="count"></span>
    <span class="head-meta" id="meta"></span>
    <div class="seg" id="sort" title="排序">
      <button data-sort="status" title="看板列从左到右（待处理在前），同列按优先级">状态</button>
      <button data-sort="priority" title="紧急在前">优先级</button>
      <button data-sort="updated" title="最近更新在前">更新</button>
    </div>
    <button class="icon-btn" id="refresh" title="立刻去 GitHub 拉一次">↻</button>
  </header>
  <div class="list" id="list"></div>
  <footer class="foot">
    <button class="foot-btn" id="open-app">打开 ACPP</button>
    <div class="pager" id="pager">
      <button class="icon-btn" id="prev" title="上一页">‹</button>
      <span class="pager-text" id="page"></span>
      <button class="icon-btn" id="next" title="下一页">›</button>
    </div>
    <button class="foot-btn" id="open-all">查看全部 issue ↗</button>
  </footer>
</div>
<script src="popover.js"></script>
</body>
</html>
